name: Contribution integration gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    if: github.repository == 'ahmadmuj/pdfcraft' && github.ref == 'refs/heads/test/pdfcraft-integration-20261025'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: "1"
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      PDFCRAFT_SYSTEM_FONTS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@2b4eb2c6d94880d926c934ec3736c92cde30086b
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: storytold/craft-common-actions/actions/install-apt-packages@2b4eb2c6d94880d926c934ec3736c92cde30086b
        with:
          packages: >-
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
            libgtk-3-dev qpdf poppler-utils
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Install Linux gate tools
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9.149,cargo-deny@0.20.2
      - name: Linux full gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          PDFCRAFT_ORACLES_REQUIRED: "1"
        run: cargo xtask ci
      - name: Windows strict Clippy and workspace tests
        if: runner.os == 'Windows'
        shell: bash
        env:
          PDFCRAFT_REQUIRE_WINRES: "1"
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Lockfile stays unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
